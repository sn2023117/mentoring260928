<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>블록 러너</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 게임 영역: 캔버스 + 화면(오버레이) 4개 -->
  <div class="wrap" id="wrap">
    <canvas id="game" width="800" height="450"></canvas>

    <!-- 1. 메인 메뉴 -->
    <section class="screen" id="menu">
      <h1>블록 러너</h1>
      <p class="sub">Space로 점프하고, 결승선까지 달려라</p>
      <button class="btn primary" id="btn-start">게임 시작</button>
    </section>

    <!-- 2. 모드 / 난이도 선택 -->
    <section class="screen hidden" id="select">
      <h2>모드 선택</h2>
      <div class="row" id="mode-row">
        <button class="btn choice" data-mode="normal">일반 모드<small>Space로 점프</small></button>
        <button class="btn choice" data-mode="fly">비행 모드<small>Space를 누르면 상승</small></button>
      </div>
      <h2>난이도</h2>
      <div class="row" id="diff-row">
        <button class="btn choice" data-diff="easy">쉬움</button>
        <button class="btn choice" data-diff="normal">보통</button>
        <button class="btn choice" data-diff="hard">어려움</button>
      </div>
      <div class="row">
        <button class="btn" id="btn-back">뒤로</button>
        <button class="btn primary" id="btn-play">플레이</button>
      </div>
    </section>

    <!-- 4. 게임 오버 -->
    <section class="screen hidden" id="gameover">
      <h2 class="bad">게임 오버</h2>
      <p class="sub" id="over-text"></p>
      <div class="row">
        <button class="btn primary" id="btn-retry">다시 시작</button>
        <button class="btn" id="btn-over-menu">메인 화면으로</button>
      </div>
    </section>

    <!-- 5. 게임 클리어 -->
    <section class="screen hidden" id="clear">
      <h2 class="good">게임 클리어!</h2>
      <p class="sub" id="clear-text"></p>
      <div class="row">
        <button class="btn primary" id="btn-again">다시 플레이</button>
        <button class="btn" id="btn-clear-menu">메인 화면으로</button>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
